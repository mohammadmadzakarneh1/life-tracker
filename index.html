<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Life Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Boot splash: shown until we know whether there is a session -->
<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- Signed out -->
<main id="auth-screen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo">◈</span>
      <h1>Life Tracker</h1>
      <p class="muted">Habits, mood, workouts and money — synced across your devices.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-authtab="signin" role="tab">Sign in</button>
      <button class="tab" data-authtab="signup" role="tab">Create account</button>
    </div>

    <form id="auth-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required
               minlength="6" placeholder="At least 6 characters">
      </label>
      <p id="auth-error" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Sign in</button>
    </form>

    <p class="auth-foot muted" id="auth-hint">
      New here? Create an account — it takes one tap and your data follows you everywhere.
    </p>
  </div>
</main>

<!-- Signed in -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <h1 class="topbar-title" id="view-title">Today</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">⏻</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" role="navigation">
    <a href="#/dashboard" class="tabbar-item" data-nav="dashboard"><span class="ico">◎</span><span>Today</span></a>
    <a href="#/habits"    class="tabbar-item" data-nav="habits"><span class="ico">✓</span><span>Habits</span></a>
    <a href="#/mood"      class="tabbar-item" data-nav="mood"><span class="ico">☺</span><span>Mood</span></a>
    <a href="#/workouts"  class="tabbar-item" data-nav="workouts"><span class="ico">⚡</span><span>Fitness</span></a>
    <a href="#/expenses"  class="tabbar-item" data-nav="expenses"><span class="ico">◈</span><span>Money</span></a>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
